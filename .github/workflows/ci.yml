name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-tests:
    name: Backend Tests (FastAPI + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cdrreader
          POSTGRES_PASSWORD: cdrreader_test
          POSTGRES_DB: cdrreader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Alembic migrations & pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://cdrreader:cdrreader_test@localhost:5432/cdrreader_test
          WATCH_DIR_ENABLED: "false"
        run: |
          alembic upgrade head
          pytest -v

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: TypeScript typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Vite production build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Compose Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build
